<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f3f5f8" />
  <title>Capacity Agent · 容量治理指挥舱</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;600;700;800&amp;family=Syne:wght@600;700&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./capacity-governance.css?v=20260827-plan-timeline" />
</head>
<body>
  <a class="skip-link" href="#main">跳至主要内容</a>
  <div class="noise" aria-hidden="true"></div>
  <div class="shell">
    <aside class="side">
      <a class="brand" href="./capacity-governance.html" aria-label="Capacity Agent 治理总览">
        <span class="brand-orbit"><i></i></span>
        <span><strong>CAPACITY</strong><small>AGENT / 02</small></span>
      </a>
      <label class="nav-search" aria-label="搜索治理菜单">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" placeholder="搜索页面 / 会话" />
        <kbd>⌘P</kbd>
      </label>
      <nav id="nav" aria-label="治理导航"></nav>
      <div class="side-status">
        <span class="live-dot"></span>
        <div><b>自主值守中</b><small>下次取数 明日 08:00</small></div>
      </div>
    </aside>

    <section class="stage">
      <header class="topbar">
        <div class="crumb-wrap">
          <small class="crumb-eyebrow">Capacity Workbench</small>
          <div class="crumb" id="crumb">我的容量治理</div>
        </div>
        <div class="top-actions">
          <button class="icon-btn" aria-label="通知">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2H4.5L6 16Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
            <span class="icon-dot" aria-hidden="true"></span>
          </button>
          <button class="icon-btn" aria-label="更多菜单">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
          </button>
          <button class="avatar" aria-label="用户：杨帆">杨</button>
        </div>
      </header>

      <section class="workline" id="workline" aria-live="polite"></section>
      <main id="main" tabindex="-1"></main>
    </section>
  </div>

  <button class="agent-float" id="agent-float" data-open-agent aria-label="打开 Capacity Agent 工作现场">
    <span class="agent-bubble"><b>Capacity Agent</b><small id="agent-mini-status">正在复核容量风险</small></span>
    <span class="agent-bot" aria-hidden="true">
      <span class="agent-antenna"></span>
      <span class="agent-face"><i></i><i></i><em></em></span>
      <span class="agent-body"><i>3</i></span>
    </span>
  </button>

  <section class="agent-drawer" id="agent-drawer" aria-hidden="true" inert>
    <header class="drawer-head">
      <div class="agent-identity"><span class="agent-core"><i></i></span><div><small>YOUR CAPACITY COLLEAGUE</small><h2>Capacity Agent</h2><p><span class="live-dot"></span> 自主值守 · 今日第 14 轮</p></div></div>
      <button class="icon-close" data-close-agent aria-label="关闭">×</button>
    </header>
    <div class="drawer-tabs" role="tablist">
      <button class="active" data-agent-tab="log" role="tab">共事记录</button>
      <button data-agent-tab="plan" role="tab">工作计划 <b>5</b></button>
    </div>
    <div class="drawer-content" id="drawer-content"></div>
    <form class="agent-form" id="agent-form">
      <div class="prompt-row">
        <button type="button" data-prompt="解释 GreatDB 的判断依据">解释判断</button>
        <button type="button" data-prompt="先分析支付系统">调整优先级</button>
        <button type="button" data-prompt="模拟缩容一个 Redis 节点">模拟方案</button>
      </div>
      <div class="input-row"><textarea id="agent-input" rows="1" placeholder="追问、纠正，或给 Agent 新的分析方向…"></textarea><button>发送</button></div>
      <small>你的反馈会进入 Agent 的工作上下文，不会自动执行生产变更</small>
    </form>
  </section>

  <section class="modal" id="evidence-modal" aria-hidden="true" inert>
    <div class="modal-card">
      <button class="icon-close" data-close-modal aria-label="关闭">×</button>
      <div id="modal-content"></div>
    </div>
  </section>
  <section class="modal" id="inspect-modal" aria-hidden="true" inert>
    <div class="modal-card">
      <button class="icon-close" data-close-inspect aria-label="关闭">×</button>
      <div id="inspect-content"></div>
    </div>
  </section>
  <section class="modal" id="events-modal" aria-hidden="true" inert>
    <div class="modal-card">
      <button class="icon-close" data-close-events aria-label="关闭">×</button>
      <div id="events-content"></div>
    </div>
  </section>
  <div class="scrim" id="scrim" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="./capacity-governance.js?v=20260827-plan-form"></script>
</body>
</html>
