<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">性能容量智能治理平台简化架构</title>
  <desc id="desc">性能容量数据和系统画像经过资源关联、规则引擎与AI分析，形成容量报告、异常告警和治理任务，并通过指标复核完成闭环。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#102a43" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#406080"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1d68d5"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>
  <text x="80" y="82" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="600" fill="#102a43">性能容量智能治理平台简化架构</text>
  <text x="80" y="120" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#627d98">数据识别 → 架构语义校准 → 异常判定 → 工单治理 → 指标复核</text>

  <!-- Layer labels -->
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="600" fill="#334e68">
    <text x="85" y="190">01 数据来源</text>
    <text x="455" y="190">02 数据与分析中心</text>
    <text x="945" y="190">03 业务应用</text>
    <text x="1280" y="190">04 治理闭环</text>
  </g>

  <!-- Layer backgrounds -->
  <rect x="70" y="215" width="300" height="520" rx="18" fill="#eef4fb" stroke="#c8d7e6"/>
  <rect x="430" y="215" width="430" height="520" rx="18" fill="#edf5ff" stroke="#b8d0ed"/>
  <rect x="920" y="215" width="280" height="520" rx="18" fill="#f4f1fb" stroke="#d8ccef"/>
  <rect x="1260" y="215" width="270" height="520" rx="18" fill="#eef8f2" stroke="#c4e2cf"/>

  <!-- Data sources -->
  <g filter="url(#shadow)" font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="100" y="270" width="240" height="105" rx="14" fill="#ffffff"/>
    <circle cx="133" cy="307" r="13" fill="#2f80ed"/>
    <text x="160" y="310" font-size="21" font-weight="600" fill="#183b56">性能容量接口</text>
    <text x="125" y="344" font-size="16" fill="#627d98">CPU、内存、磁盘、连接数</text>

    <rect x="100" y="420" width="240" height="105" rx="14" fill="#ffffff"/>
    <circle cx="133" cy="457" r="13" fill="#7b61c9"/>
    <text x="160" y="460" font-size="21" font-weight="600" fill="#183b56">系统画像接口</text>
    <text x="125" y="494" font-size="16" fill="#627d98">系统、组件、逻辑资源、角色</text>

    <rect x="100" y="570" width="240" height="105" rx="14" fill="#ffffff"/>
    <circle cx="133" cy="607" r="13" fill="#e2a93b"/>
    <text x="160" y="610" font-size="21" font-weight="600" fill="#183b56">辅助上下文</text>
    <text x="125" y="644" font-size="16" fill="#627d98">历史趋势、业务流量、变更事件</text>
  </g>

  <!-- Analysis center -->
  <g filter="url(#shadow)" font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="470" y="265" width="350" height="92" rx="14" fill="#ffffff"/>
    <text x="500" y="303" font-size="21" font-weight="600" fill="#183b56">资源关联与数据治理</text>
    <text x="500" y="333" font-size="16" fill="#627d98">系统—组件—集群—服务器统一关系</text>

    <rect x="470" y="390" width="350" height="92" rx="14" fill="#ffffff"/>
    <text x="500" y="428" font-size="21" font-weight="600" fill="#183b56">容量数据存储</text>
    <text x="500" y="458" font-size="16" fill="#627d98">当前快照、历史趋势、判定证据</text>

    <rect x="470" y="515" width="350" height="92" rx="14" fill="#ffffff"/>
    <text x="500" y="553" font-size="21" font-weight="600" fill="#183b56">规则引擎</text>
    <text x="500" y="583" font-size="16" fill="#627d98">通用基线、角色规则、系统规则</text>

    <rect x="470" y="640" width="350" height="66" rx="14" fill="#1d68d5"/>
    <text x="500" y="680" font-size="21" font-weight="600" fill="#ffffff">AI综合分析 · 解释 · 治理建议</text>
  </g>

  <!-- Application -->
  <g filter="url(#shadow)" font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="955" y="275" width="210" height="92" rx="14" fill="#ffffff"/>
    <text x="985" y="316" font-size="21" font-weight="600" fill="#183b56">容量报告</text>
    <text x="985" y="346" font-size="16" fill="#627d98">风险与趋势分析</text>

    <rect x="955" y="415" width="210" height="92" rx="14" fill="#ffffff"/>
    <text x="985" y="456" font-size="21" font-weight="600" fill="#183b56">异常告警</text>
    <text x="985" y="486" font-size="16" fill="#627d98">分级、降噪、归并</text>

    <rect x="955" y="555" width="210" height="92" rx="14" fill="#ffffff"/>
    <text x="985" y="596" font-size="21" font-weight="600" fill="#183b56">治理工作台</text>
    <text x="985" y="626" font-size="16" fill="#627d98">责任人、证据与建议</text>
  </g>

  <!-- Closed loop -->
  <g filter="url(#shadow)" font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="1290" y="275" width="210" height="80" rx="14" fill="#ffffff"/>
    <text x="1320" y="324" font-size="21" font-weight="600" fill="#183b56">JIRA治理任务</text>

    <rect x="1290" y="410" width="210" height="80" rx="14" fill="#ffffff"/>
    <text x="1320" y="459" font-size="21" font-weight="600" fill="#183b56">任务状态跟踪</text>

    <rect x="1290" y="545" width="210" height="80" rx="14" fill="#ffffff"/>
    <text x="1320" y="594" font-size="21" font-weight="600" fill="#183b56">治理效果复核</text>

    <rect x="1290" y="660" width="210" height="46" rx="14" fill="#16845b"/>
    <text x="1338" y="690" font-size="19" font-weight="600" fill="#ffffff">规则持续优化</text>
  </g>

  <!-- Main arrows -->
  <g fill="none" stroke="#406080" stroke-width="3" marker-end="url(#arrow)">
    <path d="M340 322 C395 322 410 310 470 310"/>
    <path d="M340 472 C400 472 410 335 470 330"/>
    <path d="M340 622 C400 622 410 445 470 445"/>
    <path d="M645 357 L645 390"/>
    <path d="M645 482 L645 515"/>
    <path d="M645 607 L645 640"/>
    <path d="M820 673 C890 673 895 321 955 321"/>
    <path d="M820 673 C895 673 900 461 955 461"/>
    <path d="M820 673 C900 673 905 601 955 601"/>
    <path d="M1165 601 C1230 601 1230 315 1290 315"/>
    <path d="M1395 355 L1395 410"/>
    <path d="M1395 490 L1395 545"/>
    <path d="M1395 625 L1395 660"/>
  </g>

  <!-- Feedback loop -->
  <path d="M1290 683 C1160 815 695 830 645 706" fill="none" stroke="#1d68d5" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#arrowBlue)"/>
  <text x="850" y="817" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#1d68d5">复核结果回流，持续优化规则与判断</text>

  <text x="80" y="870" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#829ab1">核心原则：系统画像描述架构事实，规则引擎负责确定性判断，AI提供综合分析与解释，指标恢复才代表治理闭环。</text>
</svg>
